<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduManage — School Management System</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">🎓</div>
        <h1>EduManage</h1>
        <p>School Management System</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="admin@school.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="error-msg hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="demo-accounts">
        <p>Demo accounts (click to fill):</p>
        <div class="demo-btns">
          <button type="button" class="demo-btn" data-email="admin@school.com" data-pass="admin123">Admin</button>
          <button type="button" class="demo-btn" data-email="teacher@school.com" data-pass="teacher123">Teacher</button>
          <button type="button" class="demo-btn" data-email="student@school.com" data-pass="student123">Student</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon-sm">🎓</span>
        <span>EduManage</span>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role" id="user-role">Administrator</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="Toggle menu">☰</button>
        <h2 id="page-title" class="page-title">Dashboard</h2>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        </div>
      </header>

      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="icon-btn">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/students.js"></script>
  <script src="js/pages/teachers.js"></script>
  <script src="js/pages/classes.js"></script>
  <script src="js/pages/subjects.js"></script>
  <script src="js/pages/attendance.js"></script>
  <script src="js/pages/grades.js"></script>
  <script src="js/pages/timetable.js"></script>
  <script src="js/pages/fees.js"></script>
  <script src="js/pages/announcements.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
